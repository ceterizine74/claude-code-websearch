[project]
name = "websearch-mcp"
version = "0.1.0"
description = "Локальный MCP-сервер веб-поиска: ротация бесплатных движков, чтение страниц в markdown, обход документации."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8.1",
    "markdownify>=0.13",
    "click>=8.1",
]

[project.scripts]
websearch = "websearch_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/websearch_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
